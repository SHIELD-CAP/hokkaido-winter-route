name: 取数据（MSM、ECMWF、气象厅产品存档）

on:
  schedule:
    - cron: '40 */3 * * *'   # 每 3 小时：世界时 00:40、03:40……，即日本时间 09:40、12:40、15:40、18:40、21:40、00:40、03:40、06:40
    - cron: '50 19 * * *'    # 日本时间 04:50，赶在 06:20 晨间复查之前（GitHub 定时常晚 50 分钟左右才跑；原先设 05:40，11-26、11-27 实际 06:34、06:27 才跑，晚于复查开始）
    - cron: '40 10 * * *'    # 日本时间 19:40，赶在 20:20 晚间日报之前
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-data.yml'
      - 'scripts/fetch-data.mjs'

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 取数据
        run: node scripts/fetch-data.mjs
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/archive data/fetch_log.csv
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "取数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
