name: 网站判级存档

# 用和网站完全相同的 site/src/engine.js 取数、判级，把结果存进 data/site_log/年/月/日/时分.json.gz；
# 传给引擎的全部输入另存到 site-inputs 分支（同名文件），以后改规则可以在真实历史上重放。
# 网站在访问者设备上现算、算完不留；这份存档用来在冬天结束后检验网站本身的成绩。
on:
  schedule:
    - cron: '5 */3 * * *'   # 每 3 小时：世界时 00:05、03:05……，即日本时间 09:05、12:05、15:05、18:05、21:05、00:05、03:05、06:05
    - cron: '5 11 * * *'    # 日本时间 20:05，对齐 20:20 的晚间日报（GitHub 定时常晚几十分钟，实际时刻以文件里的 run_jst 为准）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-archive.yml'
      - 'scripts/site-archive.js'
      - 'site/src/engine.js'

permissions:
  contents: write

concurrency:
  group: site-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 取输入整包分支（site-inputs，只放数据，不让主分支越来越大）
        uses: actions/checkout@v4
        with:
          ref: site-inputs
          path: inputs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 按网站规则判级并存档
        env:
          SITE_INPUTS_DIR: inputs
        run: node scripts/site-archive.js
      - name: 提交输入整包（site-inputs 分支）
        working-directory: inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新的输入整包"
            exit 0
          fi
          git commit -m "输入整包 $(TZ=Asia/Tokyo date +%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin site-inputs && git push origin HEAD:site-inputs && exit 0
            sleep $((i * 5))
          done
          echo "推送失败"
          exit 1
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/site_log
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "网站判级存档 $(TZ=Asia/Tokyo date +%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          echo "推送失败"
          exit 1
