name: 提前3到5天回测

# 全球模式（ECMWF 0.25 度版、GSM）提前 3～5 天报的降水，能不能把一日游道央道封路分出高低。改了脚本或标签就自动跑，也可手动运行。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_lead.py'
      - '.github/workflows/backtest-lead.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 回测
        run: python3 scripts/backtest_lead.py
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/lead3to5.md data/backtest/lead3to5.json
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "提前3到5天回测 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
