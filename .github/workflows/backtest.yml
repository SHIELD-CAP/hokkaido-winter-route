name: backtest

# 雪带规则回测：改了脚本或标签就自动重跑，也可以在 Actions 页面手动运行。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_snowband.py'
      - 'scripts/backtest_band_buffer.py'
      - 'scripts/backtest_airport.py'
      - 'data/labels.csv'
      - 'data/obs/**'
      - '.github/workflows/backtest.yml'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 回测
        run: python3 scripts/backtest_snowband.py
      - name: 加宽格点回测（取数多，失败也不影响上一步的结果提交）
        continue-on-error: true
        run: python3 scripts/backtest_band_buffer.py
      - name: 机场线回测（第一次要取数，失败也不影响前面的结果提交）
        continue-on-error: true
        run: python3 scripts/backtest_airport.py
      - name: 提交结果
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtest
          if git diff --cached --quiet; then echo '结果没有变化'; exit 0; fi
          git commit -m "回测结果 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 7
          done
          exit 1
